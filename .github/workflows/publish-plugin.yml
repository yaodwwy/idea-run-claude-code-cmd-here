name: Build and Publish JetBrains Plugin

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to publish, for example 1.0.19"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jetbrains-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, and optionally publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$MANUAL_VERSION"
          fi

          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid plugin version: $version"
            exit 1
          fi

          echo "plugin_version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build plugin
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        run: |
          if [[ -n "$PLUGIN_VERSION" ]]; then
            ./gradlew clean test buildPlugin verifyPlugin -PpluginVersion="$PLUGIN_VERSION"
          else
            ./gradlew clean test buildPlugin verifyPlugin
          fi

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: run-claude-code-cmd-anywhere-${{ github.run_number }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Check publishing token
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          JETBRAINS_PLUGIN_TOKEN: ${{ secrets.JETBRAINS_PLUGIN_TOKEN }}
        run: |
          if [[ -z "$JETBRAINS_PLUGIN_TOKEN" ]]; then
            echo "::error::Repository secret JETBRAINS_PLUGIN_TOKEN is not configured"
            exit 1
          fi

      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          JETBRAINS_PLUGIN_TOKEN: ${{ secrets.JETBRAINS_PLUGIN_TOKEN }}
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        run: ./gradlew publishPlugin -PpluginVersion="$PLUGIN_VERSION"
